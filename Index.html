<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIDIS AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#212121;
 color:white;
 display:flex;
 height:100vh;
}

.sidebar{
 width:260px;
 background:#171717;
 padding:18px;
 display:flex;
 flex-direction:column;
 gap:12px;
}

.logo{
 font-size:27px;
 font-weight:bold;
 margin:15px 0;
}

button{
 cursor:pointer;
 border:0;
 border-radius:10px;
 padding:12px;
 background:#303030;
 color:white;
}

button:hover{background:#454545}

.main{
 flex:1;
 display:flex;
 flex-direction:column;
 min-width:0;
}

header{
 padding:20px;
 border-bottom:1px solid #444;
 font-size:19px;
}

.messages{
 flex:1;
 overflow-y:auto;
 padding:22px;
 display:flex;
 flex-direction:column;
 gap:18px;
}

.message{
 max-width:85%;
 padding:14px 17px;
 border-radius:15px;
 line-height:1.6;
 overflow-wrap:anywhere;
}

.user{
 background:#303030;
 align-self:flex-end;
}

.ai{
 align-self:flex-start;
}

.message img{
 max-width:220px;
 max-height:220px;
 display:block;
 border-radius:10px;
 margin-top:10px;
}

.tools{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

.input-area{
 padding:15px;
}

.input-box{
 max-width:900px;
 margin:auto;
 background:#303030;
 border:1px solid #555;
 border-radius:18px;
 padding:10px;
 display:flex;
 align-items:center;
 gap:8px;
}

input{
 flex:1;
 min-width:0;
 background:transparent;
 border:0;
 outline:0;
 color:white;
 font-size:16px;
}

.send{
 background:white;
 color:black;
 border-radius:50%;
 width:40px;
 height:40px;
 font-size:20px;
}

.small{
 font-size:12px;
 color:#aaa;
 text-align:center;
}

.history-item{
 width:100%;
 text-align:left;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

body.light{
 background:#f5f5f5;
 color:#222;
}

body.light .sidebar{
 background:#e5e5e5;
}

body.light button{
 background:#ddd;
 color:#222;
}

body.light .input-box,
body.light .user{
 background:#ddd;
}

body.light input{
 color:#222;
}

@media(max-width:600px){
 .sidebar{
  width:75px;
  padding:7px;
 }
 .logo{
  font-size:13px;
  overflow-wrap:anywhere;
 }
 .sidebar button{
  font-size:10px;
  padding:8px 3px;
 }
 .history-item,.history-title{
  display:none;
 }
 .message{
  max-width:95%;
 }
}
</style>
</head>

<body>

<aside class="sidebar">

 <div class="logo">VIDIS AI</div>

 <button onclick="newChat()">＋ New Chat</button>

 <button onclick="toggleTheme()">🌙 Theme</button>

 <button onclick="startVoice()">🎤 Voice</button>

 <p class="small history-title">CHAT HISTORY</p>

 <div id="history"></div>

</aside>

<main class="main">

<header>
 <b>VIDIS AI</b> · Assistant
</header>

<section class="messages" id="messages">

 <div class="message ai">
  Hello! Welcome to VIDIS AI.
  How can I help you today?
 </div>

</section>

<div class="input-area">

 <div class="input-box">

  <button onclick="document.getElementById('imageFile').click()">📷</button>

  <button onclick="document.getElementById('documentFile').click()">📎</button>

  <input id="input"
   placeholder="Message VIDIS AI..."
   onkeydown="if(event.key==='Enter')sendMessage()">

  <button class="send" onclick="sendMessage()">↑</button>

 </div>

 <input type="file" id="imageFile" accept="image/*" hidden onchange="uploadImage(this)">

 <input type="file" id="documentFile" hidden onchange="uploadDocument(this)">

 <p class="small">
  VIDIS AI · Your intelligent assistant
 </p>

</div>

</main>

<script>

let chats=JSON.parse(localStorage.getItem("vidisChats")||"[]");
let current=[];
let activeChat=null;
let attachments=[];

function save(){
 localStorage.setItem("vidisChats",JSON.stringify(chats));
}

function addMessage(text,type){

 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;

 document.getElementById("messages").appendChild(div);

 if(type==="ai"){
  const copy=document.createElement("button");
  copy.textContent="📋 Copy";
  copy.onclick=()=>navigator.clipboard.writeText(text);
  div.appendChild(document.createElement("br"));
  div.appendChild(copy);
 }

 document.getElementById("messages").scrollTop=999999;

 return div;
}

function uploadImage(input){

 const file=input.files[0];
 if(!file)return;

 attachments.push({name:file.name,type:"image",file:file});

 addMessage("📷 Image attached: "+file.name,"user");

 input.value="";
}

function uploadDocument(input){

 const file=input.files[0];
 if(!file)return;

 attachments.push({name:file.name,type:"document",file:file});

 addMessage("📎 File attached: "+file.name,"user");

 input.value="";
}

function sendMessage(){

 const input=document.getElementById("input");
 const text=input.value.trim();

 if(!text && attachments.length===0)return;

 const attachedNames=attachments.map(a=>a.name);

 if(text){
  addMessage(text,"user");
  current.push({role:"user",content:text});
 }

 if(attachedNames.length){
  current.push({
   role:"user",
   content:"Attachments: "+attachedNames.join(", ")
  });
 }

 input.value="";
 attachments=[];

 if(activeChat===null){
  activeChat=Date.now();
  chats.push({
   id:activeChat,
   title:text||"New conversation",
   messages:current
  });
 }else{
  const chat=chats.find(c=>c.id===activeChat);
  if(chat)chat.messages=current;
 }

 save();
 showHistory();

 const loading=addMessage("VIDIS AI is thinking...","ai");

 setTimeout(()=>{
  loading.textContent=
   "Your message has been received! The real AI service is not connected yet. A secure AI backend is needed to generate intelligent answers.";
 },1000);

}

function newChat(){

 current=[];
 activeChat=null;
 attachments=[];

 document.getElementById("messages").innerHTML=
 '<div class="message ai">Hello! Welcome to VIDIS AI. How can I help you today?</div>';

}

function showHistory(){

 const box=document.getElementById("history");
 box.innerHTML="";

 chats.forEach(chat=>{

  const button=document.createElement("button");
  button.className="history-item";
  button.textContent=chat.title;
  button.onclick=()=>openChat(chat.id);

  box.appendChild(button);

 });

}

function openChat(id){

 const chat=chats.find(c=>c.id===id);
 if(!chat)return;

 activeChat=id;
 current=chat.messages;

 document.getElementById("messages").innerHTML="";

 current.forEach(m=>{
  addMessage(m.content,m.role==="user"?"user":"ai");
 });

}

function toggleTheme(){
 document.body.classList.toggle("light");
}

function startVoice(){

 const Speech=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!Speech){
  alert("Voice input is not supported by this browser.");
  return;
 }

 const recognition=new Speech();

 recognition.lang="en-US";

 recognition.onresult=e=>{
  document.getElementById("input").value=
  e.results[0][0].transcript;
 };

 recognition.start();

}

showHistory();

</script>

</body>
</html>
